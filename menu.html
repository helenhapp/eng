<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Main Menu - English Lessons" />

    <link rel="icon" type="image/svg+xml" href="./media/icons/space.svg" />

    <title>English Menu</title>

    <script>
      const savedTheme = localStorage.getItem("lms_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tektur:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css?v=1.1" />
    <script src="./main.js?v=1.1" defer></script>

    <!-- Custom styles just for the menu grid cards -->
    <style>
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 15px 0;
      }
      .menu-card {
        display: block;
        background-color: var(--panel-alt);
        border: 2px solid var(--accent);
        border-radius: 8px;
        padding: 25px 20px;
        text-decoration: none;
        color: var(--text-main);
        transition: all 0.3s ease;
        box-shadow: var(--btn-shadow);
        text-align: center;
      }
      .menu-card:hover {
        transform: translateY(-5px);
        background-color: var(--hover-bg);
        border-color: var(--accent-pop);
        box-shadow: 0 8px 15px var(--shadow-accent);
      }
      .menu-card h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 1.5rem;
        transition: color 0.3s ease;
      }
      .menu-card:hover h3 {
        color: var(--accent-pop);
      }
      .menu-card p {
        margin: 0;
        color: var(--text-soft);
        font-size: 15px;
        font-weight: 500;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="transition-curtain"></div>

    <div id="nav-container">
      <nav class="top-bar">
        <div class="logo-container">
          <img
            src="./media/icons/space.svg"
            alt="Space Logo"
            class="site-logo"
          />
        </div>
        <div class="top-bar__controls">
          <label class="toggle-switch" aria-label="Перемикач теми">
            <input type="checkbox" id="theme-checkbox" />
            <span class="slider">
              <span class="icon sun"
                ><img src="./media/icons/stars.svg"
              /></span>
              <span class="icon moon"
                ><img src="./media/icons/moon.svg"
              /></span>
            </span>
          </label>
          <button
            id="dyslexia-mode-btn"
            class="wide-toggle"
            title="Шрифт для дислектиків"
          >
            <img src="./media/icons/alphabet.svg" />
          </button>
        </div>
      </nav>
    </div>

    <header>
      <div class="title-container">
        <!-- Arrow removed to keep the title centered on the menu -->
        <div style="grid-column: 1"></div>
        <h1 id="lesson-title">Main Menu</h1>
        <div style="grid-column: 3"></div>
      </div>
      <p class="topic">English Lessons</p>
      <hr />
    </header>

    <main>
      <!-- Menu Section -->
      <section class="lesson-wrapper active show">
        <div class="lesson-block">
          <div class="lesson-header">
            <h2>
              <img src="./media/icons/stars.svg" class="star" alt="icon" />
              <span>Course Curriculum</span>
            </h2>
          </div>

          <div class="lesson-content">
            <div class="menu-grid">
              <a href="./lesson2.html" class="menu-card">
                <h3>Lesson 02</h3>
                <p>Past Simple</p>
              </a>

              <a href="./lesson3.html" class="menu-card">
                <h3>Lesson 03</h3>
                <p>1st & 2nd Conditionals</p>
              </a>

              <a href="./lesson4.html" class="menu-card">
                <h3>Lesson 04</h3>
                <p>Future Simple</p>
              </a>

              <a href="./lesson5.html" class="menu-card">
                <h3>Lesson 05</h3>
                <p>Numbers & Time</p>
              </a>

              <a href="./lesson6.html" class="menu-card">
                <h3>Lesson 06</h3>
                <p>Pronouns</p>
              </a>

              <a href="./lesson7.html" class="menu-card">
                <h3>Lesson 07</h3>
                <p>Verbs + Prepositions TO/AT</p>
              </a>

              <!-- Add future lessons here -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Made by Olena Hapchyna</p>
    </footer>

    <button
      id="scrollToTopBtn"
      class="scroll-to-top"
      aria-label="Scroll to top"
    >
      <img src="./media/icons/ufo-alien.svg" />
    </button>
  </body>
</html>
